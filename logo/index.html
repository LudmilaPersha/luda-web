<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Тест логотипу: не показувати в пошукових системах -->
<meta name="robots" content="noindex">
<title>Логотип — варіанти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Old+Standard+TT:wght@700&family=Playfair+Display:wght@600&family=Cormorant+SC:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --ink: #222; --muted: #666; --line: #ddd; --olive: #45422c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #fff; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  figure img, figure svg { display: block; width: 100%; height: auto; }
  figcaption { font-size: 14px; margin-top: 8px; }
  figcaption b { display: block; }
  figcaption span { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <figure><img src="original.png" alt="Оригінальний російський логотип"><figcaption><b>Оригінал</b></figcaption></figure>
    <figure data-font="Oranienbaum" data-w="400"><figcaption><b>A</b></figcaption></figure>
    <figure data-font="Old Standard TT" data-w="700"><figcaption><b>B</b></figcaption></figure>
    <figure data-font="Playfair Display" data-w="600"><figcaption><b>C</b></figcaption></figure>
    <figure data-font="Cormorant SC" data-w="700"><figcaption><b>D</b></figcaption></figure>
  </div>
</div>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const R = 232, CX = 300, CY = 300;
  const pt = a => [CX + R * Math.cos(a * Math.PI / 180), CY - R * Math.sin(a * Math.PI / 180)];
  const SQ = 0.58, SIZE = 88, GAP = 0;    // вузькі високі літери, як в оригіналі
  // Кожна літера окремо: стиснута по ширині й поставлена по дузі (вгорі — по колу, внизу — «усмішкою»)
  function arcText(g, str, font, weight, r, cy, mid, down) {
    const probe = document.createElementNS(NS, 'text');
    probe.setAttribute('font-family', `'${font}', serif`); probe.setAttribute('font-weight', weight);
    probe.setAttribute('font-size', SIZE); g.appendChild(probe);
    const ws = [...str].map(ch => { probe.textContent = ch === ' ' ? ' ' : ch; return probe.getComputedTextLength() * SQ + GAP; });
    probe.remove();
    const total = ws.reduce((a, b) => a + b, 0);
    let s = -total / 2;
    [...str].forEach((ch, i) => {
      const a = (s + ws[i] / 2) / r;                 // кут від середини, радіани
      s += ws[i];
      if (ch === ' ') return;
      const x = CX + r * Math.sin(a), y = down ? cy + r * Math.cos(a) : cy - r * Math.cos(a);
      const rot = (down ? -a : a) * 180 / Math.PI;
      const t = document.createElementNS(NS, 'text');
      t.textContent = ch; t.setAttribute('text-anchor', 'middle');
      t.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${SQ} 1)`);
      g.appendChild(t);
    });
  }
  function logo(f, i) {
    const font = f.dataset.font, w = f.dataset.w;
    f.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 600 600" xmlns="${NS}" role="img" aria-label="Перший магазин вражень в Чехії">
      <g fill="var(--olive)" font-family="'${font}', serif" font-weight="${w}" font-size="${SIZE}"></g>
      <image href="emblem.png" x="150" y="215" width="300" height="176"/></svg>`);
    const g = f.querySelector('g');
    arcText(g, 'ПЕРШИЙ МАГАЗИН ВРАЖЕНЬ', font, w, 215, CY, 0, false);
    arcText(g, 'В ЧЕХІЇ', font, w, 420, 545 - 420, 0, true);
  }
  document.fonts.ready.then(() => document.querySelectorAll('figure[data-font]').forEach(logo));
</script>
</body>
</html>
