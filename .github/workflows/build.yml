# Після зміни текстів (content/), шаблону (_src/) або фото (pilot2/) GitHub сам збирає сайт у dist/
# і викладає його на Cloudflare Pages (секрети CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
name: Build site from texts
on:
  push:
    branches: [main]
    paths: ["content/**", "_src/**", "pilot2/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _src/build.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 pages deploy dist --project-name=luda-web --branch=main --commit-dirty=true
