# Після зміни текстів (content/) або шаблону (_src/) GitHub сам збирає головну сторінку (index.html) і зберігає результат
name: Build site from texts
on:
  push:
    branches: [main]
    paths: ["content/**", "_src/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _src/build.py
      - name: Commit built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pilot2/index.html pilot2/footer/index.html
          git diff --cached --quiet || { git commit -m "Build pilot 2 from content/"; git push; }
