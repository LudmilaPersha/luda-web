# Після зміни текстів (content/) або шаблону (_src/) GitHub сам збирає головну сторінку (index.html),
# зберігає результат і викладає сайт на Cloudflare Pages (секрети CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)
name: Build site from texts
on:
  push:
    branches: [main]
    paths: ["content/**", "_src/**", "pilot2/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _src/build.py
      - name: Commit built pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pilot2/index.html pilot2/footer/index.html
          git diff --cached --quiet || { git commit -m "Build pilot 2 from content/"; git push; }
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p dist/pilot2/footer
          cp index.html dist/
          cp pilot2/*.png pilot2/*.jpg pilot2/index.html dist/pilot2/
          cp pilot2/footer/index.html dist/pilot2/footer/
          cp -r pilot2/images dist/pilot2/
          npx -y wrangler@3 pages project create luda-web --production-branch=main || true
          npx -y wrangler@3 pages deploy dist --project-name=luda-web --branch=main --commit-dirty=true
